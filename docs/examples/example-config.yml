# 示例:接入 "网运通项目组"(WYT)的完整配置
# 项目工作项类型:史诗(epic)/ 特性(feature)/ 用户故事(story)/ 任务(task)/ 缺陷(bug)
# 迭代:正常迭代分组下的 Sprint N

project: "网运通项目组"       # 或 "WYT"
sprint: ""                    # 留空:每次运行自动选进行中的迭代,多个时询问

mapping:
  spec_artifact: "用户故事"    # 单卡模式:一个 spec = 一张可交付的 story 卡
  story_artifact: ""           # 留空 = User Story 章节仅嵌入描述(单卡模式)
  task_artifact: "任务"        # 任务行建为任务工作项,--parent 挂 story

priority_mapping:
  p1: "高"                     # 章节 (Priority: P1) 🎯 MVP → 高
  p2: "中"
  p3: "低"

defaults:
  spec:
    priority: ""               # 可填 "中" / "高"
  story:
    priority: ""               # 章节卡兜底优先级(章节无 P 编号时)
  task:
    priority: ""

status_mapping:
  completed: "已完成"
  pending: "未开始"
  in_progress: "进行中"

sync:
  complete_story_when_tasks_done: true

# 按章节模式示例(User Story 章节各自建卡):改为
#   story_artifact: "用户故事"
#   spec_artifact: ""          # 章节卡直接挂特性;或设 "特性" 作章节卡父卡
# 此时层级为 Feature → 用户故事(每章节一张) → 任务([US#] 标记路由)
