# 示例:接入 "网运通项目组"(WYT)的完整配置
# 项目工作项类型:史诗(epic)/ 特性(feature)/ 用户故事(story)/ 任务(task)/ 缺陷(bug)
# 迭代:正常迭代分组下的 Sprint N

project: "网运通项目组"       # 或 "WYT"
product: ""                    # 留空:每次运行交互选择需求所在的产品
sprint: ""                    # 留空:每次运行自动选进行中的迭代,多个时询问

# 完整需求树示例:spec = 特性(挂所选史诗下),User Story 章节 = 用户故事(挂 spec 卡下)
mapping:
  spec_artifact: "特性"        # spec 卡:非 User Story 正文(任务不进卡描述)
  story_artifact: "用户故事"    # 每章节一张用户故事卡,挂 spec 卡下,内容为章节自身

# 只建一张卡的示例:把 mapping 改为
#   spec_artifact: "特性"
#   story_artifact: ""
# 此时整个 spec(含章节)折叠进一张特性卡,挂所选史诗下

priority_mapping:
  p1: "高"                     # 章节 (Priority: P1) 🎯 MVP → 高
  p2: "中"
  p3: "低"

defaults:
  spec:
    priority: ""               # 可填 "中" / "高"
  story:
    priority: ""               # 章节卡兜底优先级(章节无 P 编号时)

status_mapping:
  completed: "已完成"

sync:
  complete_story_when_tasks_done: true
