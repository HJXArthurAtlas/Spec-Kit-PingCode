---
schema_version: "1.0"

extension:
  id: "pingcode"
  name: "PingCode Integration"
  version: "2.5.0"
  description: "Create PingCode requirement tree (idea → epic → feature + user stories) from spec-kit artifacts via the pingcode CLI"
  author: "ArthurAtlas"
  repository: "https://github.com/HJXArthurAtlas/Spec-Kit-PingCode"
  license: "MIT"
  homepage: "https://github.com/HJXArthurAtlas/Spec-Kit-PingCode"

requires:
  speckit_version: ">=0.1.0"
  # 运行时依赖:pingcode CLI(metaphor/pingcode-cli)
  #   安装:  https://github.com/metaphor/pingcode-cli
  #   认证:  pingcode auth login(或 PINGCODE_CLIENT_ID/SECRET 环境变量)
  #   上下文: pingcode context set-current-project <项目名>
  # 扩展本身不含任何代码,所有 PingCode 操作由 agent 通过 bash 执行 pingcode 命令完成。

provides:
  commands:
    - name: "speckit.pingcode.specstoissues"
      file: "commands/specstoissues.md"
      description: "Create PingCode cards (idea → epic → feature + user stories) from spec"
      aliases: ["speckit.pingcode.spec2items"]

    - name: "speckit.pingcode.init"
      file: "commands/init.md"
      description: "Interactive setup: pick project, sprint and mapping types, generate pingcode-config.yml"

    - name: "speckit.pingcode.discover-context"
      file: "commands/discover-context.md"
      description: "Discover PingCode project types/states/sprints and generate config snippets"

    - name: "speckit.pingcode.sync-status"
      file: "commands/sync-status.md"
      description: "Auto-close PingCode cards when their local tasks are all checked"

  config:
    - name: "pingcode-config.yml"
      template: "pingcode-config.template.yml"
      description: "PingCode integration configuration"
      required: true

hooks:
  after_plan:
    command: "speckit.pingcode.specstoissues"
    optional: true
    # hook 按 priority 升序执行(默认 10,同值按注册顺序);取 99 保证建卡排在其他
    # after_plan hook(如 adrkit.check 的方案校验)之后,读到的是最终形态的 plan
    priority: 99
    prompt: "选择关联需求并创建 PingCode 卡片?"
    description: "在 /speckit.plan 完成后可选创建 PingCode 需求树卡片(动态祖先关联)"
  after_tasks:
    command: "speckit.pingcode.specstoissues"
    optional: true
    priority: 99
    prompt: "根据 tasks.md 补建任务卡?"
    description: "task_artifact 已配置时,在 /speckit.tasks 生成后补建任务卡(幂等,已存在的卡片不重建)"

tags:
  - "issue-tracking"
  - "pingcode"
  - "project-management"
