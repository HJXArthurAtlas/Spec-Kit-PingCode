# PingCode Integration Configuration
# 复制为 pingcode-config.yml 并按你的项目定制:
#   cp .specify/extensions/pingcode/pingcode-config.template.yml \
#      .specify/extensions/pingcode/pingcode-config.yml

# PingCode 项目(必填)
# 支持项目名或项目标识符,如 "网运通项目组" 或 "WYT"
# 运行时通过 `pingcode context set-current-project` 解析为 project_id
project: ""

# 迭代(可选,留空 = 每次运行动态解析)
# 解析优先级:--sprint 命令参数 > 此处 > context 当前迭代 > sprint list --status in_progress 自动/询问
sprint: ""

# 制品 → 工作项类型映射
# 类型名以项目实际配置为准,可用 /speckit.pingcode.discover-context 查询
mapping:
  # SPEC.md 整体映射的工作项类型(默认用户故事:一个 spec 是一个可交付闭环)
  # story_artifact 非空(按章节模式)时,此项可选作章节卡的父卡类型——
  # 建议留空或设更高需求类型(如 "特性");单卡模式下即 spec 卡本身
  spec_artifact: "用户故事"

  # spec.md 的 `### User Story N` 章节映射的工作项类型
  # 留空 "" = 单卡模式(默认):整个 spec 一张卡,User Story 章节仅嵌入描述
  # 设为类型名(如 "用户故事") = 按章节模式:每个章节建一张卡,
  #   任务按 [US#] 标记挂到所属章节卡
  story_artifact: ""

  # 任务行映射的工作项类型
  # 设为 "" = 极简模式:任务只存在于 story 描述的 checklist 中,不建工作项
  task_artifact: "任务"

# 章节 P1/P2/P3 → 项目优先级名(按章节模式创建章节卡时使用)
# 从章节标题尾注捕获 P 编号(如 "(Priority: P1)"、"(P1)"),按此映射设置 --priority
# 未捕获编号的章节回落 defaults.story.priority,仍未设置则不设优先级
# 优先级名以项目实际字典为准,可用 /speckit.pingcode.discover-context 查询
priority_mapping:
  p1: "高"                   # P1 🎯 MVP
  p2: "中"
  p3: "低"

# 默认值(可选)
defaults:
  spec:
    priority: ""   # 如 "中" / "高",留空不设置
  story:
    priority: ""   # 按章节模式章节卡的兜底优先级(章节无 P 编号或映射未命中时)
  task:
    priority: ""

# 状态映射(sync-status 使用)
# 将 TASKS.md 完成标记映射到 PingCode 状态名
# 状态名按项目可配置;执行时若名称不匹配,按 state_type
# (completed/started/pending)兜底解析
status_mapping:
  completed: "已完成"       # - [x]
  pending: "未开始"         # - [ ]
  in_progress: "进行中"     # - [~](可选约定)

# 同步行为
sync:
  # 任务全部完成后,是否将 story 自动流转到完成态
  complete_story_when_tasks_done: true

# 环境变量覆盖(优先级高于本文件):
#   SPECKIT_PINGCODE_PROJECT
#   SPECKIT_PINGCODE_SPRINT
#   SPECKIT_PINGCODE_SPEC_ARTIFACT
#   SPECKIT_PINGCODE_STORY_ARTIFACT
#   SPECKIT_PINGCODE_TASK_ARTIFACT
#   SPECKIT_PINGCODE_PRIORITY_P1
#   SPECKIT_PINGCODE_PRIORITY_P2
#   SPECKIT_PINGCODE_PRIORITY_P3
#   SPECKIT_PINGCODE_STATUS_COMPLETED
#   SPECKIT_PINGCODE_STATUS_PENDING
#   SPECKIT_PINGCODE_STATUS_IN_PROGRESS
